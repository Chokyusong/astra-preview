  // 기와·문양에 빛이 스치고 달빛이 밝아진다. 빛줄기는 마우스 쪽으로 기울며 밝아진다. 0.18초 늦게 따라오고,
  // 2.5초 쉬면 30% 세기로 24초에 한 바퀴 돈다. 그림 전체가 마우스 반대쪽으로 최대 10px(0.8초 늦게) 움직인다.
  // 마우스가 있는 PC에서만. 휴대폰은 아래 phoneLight가 같은 빛을 스스로 움직인다(대표 11-14)

/* 휠을 내리거나(PC) 손가락으로 위로 밀면(휴대폰) 홈이 흐려지며 사라지고 회사소개로 넘어간다(대표 11-13 "홈에서 휠다운하면 페이드어웨이로

   움직임 줄이기 설정이면 바로 넘어간다. 뒤로 가기로 돌아오면 처음 모습으로 되돌린다 */

    // 회사소개 첫 화면 밝기에 맞춘다(대표 11-13 "아예 꺼졌다 없어지는 것보다 서서히 어두워져서 회사소개로 맞춰지게"). 홈의 가운데 막은 걷는다
    var bg = document.querySelector('.home-bg'), veil = document.createElement('div');
