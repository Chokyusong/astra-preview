<script>
/* 홈: 움직이는 배경, 굵기가 숨 쉬는 ASTRA, 떠 있는 버튼, 마우스 반응(대표 11-12 "홈에서도 마우스 인터랙티브") */
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv = document.querySelector('.home-gl');
  // 마우스 반응: 회사소개 첫 화면과 같은 값. 마우스 둘레(창 가로의 18%)에서 별이 켜지고 소나무가 더 흔들리고
  // 기와·문양에 빛이 스치고 달빛이 밝아진다. 빛줄기는 마우스 쪽으로 기울며 밝아진다. 0.18초 늦게 따라오고,
  // 2.5초 쉬면 30% 세기로 24초에 한 바퀴 돈다. 그림 전체가 마우스 반대쪽으로 최대 10px(0.8초 늦게) 움직인다.
  // 마우스가 있는 PC에서만. 휴대폰은 전과 같다
  var hover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  var M = { x: 0, y: 0, at: 0 }, HS = { x: 0.5, y: 0.45, i: 0, px: 0, py: 0, last: 0 };
  var lag = function (dt, s) { return 1 - Math.exp(-dt / 1000 / s); };
  window.addEventListener('pointermove', function (e) { if (e.pointerType === 'mouse') { M.x = e.clientX; M.y = e.clientY; M.at = performance.now(); } }, { passive: true });
  function mouse() {
    var t = performance.now(), dt = Math.min(t - (HS.last || t), 100); HS.last = t;
    var W = window.innerWidth, H = window.innerHeight, live = M.at && t - M.at < 2500, tx, ty, ti, k;
    if (live) { tx = M.x / W; ty = M.y / H; ti = 1; k = lag(dt, 0.18); }
    else { var a = t / 24000 * 6.283; tx = 0.5 + 0.3 * Math.cos(a); ty = 0.42 + 0.18 * Math.sin(a); ti = 0.3; k = lag(dt, 0.6); }
    HS.x += (tx - HS.x) * k; HS.y += (ty - HS.y) * k; HS.i += (ti - HS.i) * lag(dt, 0.5);
    var mx = M.at ? M.x / W * 2 - 1 : 0, my = M.at ? M.y / H * 2 - 1 : 0;
    HS.px += (-mx * 10 - HS.px) * lag(dt, 0.8); HS.py += (-my * 10 - HS.py) * lag(dt, 0.8);
    cv.style.transform = 'translate3d(' + HS.px.toFixed(2) + 'px,' + HS.py.toFixed(2) + 'px,0) scale(1.03)';
    return [HS.x, HS.y, HS.i, 0.18];
  }
  // 배경: 확정 시험본처럼 늘 움직이고, 움직임 줄이기 설정이면 한 장만 그린다. 창이 안 보이면 쉰다
  if (cv && window.HomeMotion) window.HomeMotion.start(cv, function () { return !reduce && !document.hidden; }, hover && !reduce ? mouse : null);
  if (reduce && cv) window.addEventListener('resize', function () { if (cv.__draw) cv.__draw(0); });
  // ASTRA: 글자마다 0.25초씩 늦게 가늘어졌다 두꺼워진다(캔버스 홈 판과 같은 값)
  if (!reduce) document.querySelectorAll('.astra-letter').forEach(function (el, i) {
    el.animate([{ fontVariationSettings: '"wght" 100' }, { fontVariationSettings: '"wght" 900' }],
      { duration: 1500, delay: -12000 + i * 250, iterations: Infinity, direction: 'alternate', easing: 'cubic-bezier(.37,0,.63,1)' });
  });
  // 떠 있는 버튼: 누르면 네 개가 펼쳐지고 다시 누르면 닫힌다(다른 쪽과 같다)
  var button = document.querySelector('.fab-button'), box = document.querySelector('.fab');
  function setFab(open, refocus) {
    if (document.body.classList.contains('fab-open') === open) return;
    document.body.classList.toggle('fab-open', open);
    button.setAttribute('aria-expanded', String(open));
    button.setAttribute('aria-label', open ? '상담·지원 바로가기 닫기' : '상담·지원 바로가기 열기');
    if (refocus) button.focus();
  }
  button.addEventListener('click', function () { setFab(!document.body.classList.contains('fab-open')); });
  document.addEventListener('click', function (e) { if (!box.contains(e.target)) setFab(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && document.body.classList.contains('fab-open')) setFab(false, true); });
})();
</script>
